<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#f9f9f8">
<title>Budget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f9f9f8;--surface:#fff;--border:#e8e8e6;--border2:#d4d4d0;
  --text:#1a1a18;--text2:#6b6b67;--text3:#a8a8a4;
  --green:#16a34a;--green-bg:#f0fdf4;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --nav-h:64px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;height:100%;overflow:hidden;user-select:none}

/* SPLASH */
#splash{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-icon{width:64px;height:64px;background:var(--text);border-radius:16px;display:flex;align-items:center;justify-content:center}
.splash-icon svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.splash-title{font-size:20px;font-weight:600;letter-spacing:-.02em}
.splash-sub{font-size:13px;color:var(--text3)}
.splash-loader{width:40px;height:3px;background:var(--border);border-radius:100px;overflow:hidden;margin-top:8px}
.splash-loader-fill{height:100%;background:var(--text);border-radius:100px;animation:load 1.2s ease forwards}
@keyframes load{from{width:0%}to{width:100%}}

/* AUTH SCREEN */
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;animation:fadeIn .3s ease}
#auth-screen.show{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.06)}
.auth-icon{width:48px;height:48px;background:var(--text);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.auth-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.auth-title{font-size:20px;font-weight:600;letter-spacing:-.02em;text-align:center;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:1.5rem}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--radius-sm);padding:3px;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:7px;border:none;background:none;border-radius:6px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .15s;font-family:inherit}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.auth-field{margin-bottom:12px}
.auth-field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.auth-field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;transition:border-color .15s;outline:none}
.auth-field input:focus{border-color:var(--border2);background:#fff}
.auth-field input::placeholder{color:var(--text3)}
.auth-btn{width:100%;background:var(--text);border:none;border-radius:var(--radius-sm);padding:11px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:4px}
.auth-btn:hover{opacity:.88}
.auth-btn:active{opacity:.75}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-google{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.auth-google:hover{border-color:var(--border2);background:#fafaf9}
.auth-google svg{width:18px;height:18px;flex-shrink:0}
.auth-error{background:var(--red-bg);color:var(--red);border-radius:var(--radius-xs);padding:8px 12px;font-size:12px;margin-bottom:10px;display:none}
.auth-error.show{display:block}
.auth-footer{text-align:center;margin-top:1.25rem;font-size:11px;color:var(--text3);font-style:italic;font-family:'Georgia',serif}

/* TOAST */
#toast-wrap{position:fixed;top:calc(var(--safe-top) + 12px);left:12px;right:12px;z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--text);color:#fff;border-radius:var(--radius-sm);padding:11px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:toastIn .3s ease;pointer-events:all}
.toast.success{background:#16a34a}
.toast.warn{background:#d97706}
.toast.celebrate{background:linear-gradient(135deg,#7c3aed,#2563eb)}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}

/* CONFETTI */
.confetti-piece{position:fixed;pointer-events:none;z-index:999;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* A2HS */
#a2hs{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bot) + 12px);left:12px;right:12px;background:var(--text);color:#fff;border-radius:var(--radius);padding:12px 16px;z-index:200;display:none;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);animation:slideUp .3s ease}
#a2hs.show{display:flex}
.a2hs-text{flex:1;font-size:13px;line-height:1.4}
.a2hs-text strong{display:block;font-weight:600;margin-bottom:2px}
.a2hs-text span{opacity:.7;font-size:12px}
.a2hs-close{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top);display:none}
#app.show{display:flex}
.app-header{padding:14px 16px 0;flex-shrink:0}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hdr-left h1{font-size:18px;font-weight:600;letter-spacing:-.02em}
.hdr-left p{font-size:12px;color:var(--text3);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px}
.save-badge{font-size:11px;color:var(--text3)}
.icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 11px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit}
.icon-btn:hover{background:var(--surface);border-color:var(--border2)}
.icon-btn:active{transform:scale(.97)}
.icon-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.month-scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.month-scroll::-webkit-scrollbar{display:none}
.m-btn{flex-shrink:0;background:none;border:1px solid transparent;border-radius:var(--radius-sm);padding:5px 13px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;position:relative;font-family:inherit}
.m-btn:hover{background:var(--surface);border-color:var(--border)}
.m-btn.active{background:var(--text);color:#fff}
.m-btn.has-data::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;background:var(--green);border-radius:50%}
.m-btn.active.has-data::after{background:rgba(255,255,255,.6)}
.m-add{color:var(--text3);font-size:16px;padding:4px 10px}
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 16px;scrollbar-width:none}
.scroll-area::-webkit-scrollbar{display:none}
.page{animation:pageIn .25s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.page-left{animation:pageInLeft .25s ease}
@keyframes pageInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.bottom-nav{height:calc(var(--nav-h) + var(--safe-bot));padding-bottom:var(--safe-bot);background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .15s;border:none;background:none;font-family:inherit;padding:8px 0;-webkit-tap-highlight-color:transparent}
.nav-item:active{transform:scale(.92)}
.nav-icon{width:22px;height:22px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.nav-label{font-size:10px;font-weight:500;color:var(--text3);transition:color .15s}
.nav-item.active .nav-icon{stroke:var(--text)}
.nav-item.active .nav-label{color:var(--text)}
.nav-dot{width:4px;height:4px;background:var(--text);border-radius:50%;margin-top:1px;opacity:0;transition:opacity .15s}
.nav-item.active .nav-dot{opacity:1}

/* SKELETON */
.sk{background:linear-gradient(90deg,#f0f0ee 25%,#e8e8e6 50%,#f0f0ee 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi-wide{grid-column:span 2}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;transition:border-color .15s}
.kpi-label{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kpi-val{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:100px;margin-top:5px}
.delta-up{background:var(--red-bg);color:var(--red)}
.delta-down{background:var(--green-bg);color:var(--green)}

/* GOAL */
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:12px}
.goal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.goal-label{font-size:12px;font-weight:500}
.goal-input-wrap{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-xs);padding:4px 8px}
.goal-input-wrap span{font-size:12px;color:var(--text3)}
.goal-input-wrap input{background:none;border:none;font-size:12px;font-weight:500;color:var(--text);width:80px;font-family:inherit;outline:none}
.goal-stats{display:flex;gap:14px;margin-bottom:10px}
.goal-stat{font-size:11px;color:var(--text3)}
.goal-stat strong{color:var(--text);font-weight:600}
.goal-track{height:6px;background:var(--bg);border-radius:100px;overflow:hidden}
.goal-fill{height:100%;border-radius:100px;transition:width .7s cubic-bezier(.4,0,.2,1),background .3s}

/* INSIGHT */
.insight{display:flex;align-items:flex-start;gap:10px;padding:.75rem 1rem;border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px}
.insight-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.insight-text strong{font-weight:600;display:block;margin-bottom:1px;font-size:13px}
.insight-text span{font-size:12px;opacity:.85}
.insight-green{background:var(--green-bg);color:var(--green)}
.insight-amber{background:var(--amber-bg);color:var(--amber)}
.insight-red{background:var(--red-bg);color:var(--red)}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.chart-full{grid-column:span 2}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem}
.card-lbl{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem}
.ring-wrap{position:relative;width:100px;height:100px;margin:0 auto .5rem}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-val{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ring-cap{font-size:10px;color:var(--text3)}
.cleg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:.4rem}
.cleg span{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.cdot{width:7px;height:7px;border-radius:2px;flex-shrink:0}

/* SECTION */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.sec-hdr-left{display:flex;align-items:center;gap:7px}
.sec-title{font-size:13px;font-weight:600}
.sec-tag{font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-gray{background:#f4f4f2;color:var(--text2)}
.copy-btn{font-size:12px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s;padding:0}
.copy-btn:hover{color:var(--text)}

/* TABLE */
.tbl{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:4px}
.tbl-head{display:grid;padding:6px 12px;background:#fafaf9;border-bottom:1px solid var(--border)}
.th{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.th:not(:first-child){text-align:right}
.tbl-row{display:grid;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center;gap:8px;transition:background .1s}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:#fafaf9}
.tbl-total{background:#fafaf9;border-top:1px solid var(--border)}
.c4{grid-template-columns:2fr 1fr 1fr 1fr}
.c3{grid-template-columns:2fr 1fr auto}
.rname{font-size:13px;font-weight:500}
.rsub{font-size:11px;color:var(--text3);margin-top:1px}
.rest{font-size:12px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.ract{text-align:right}
.ract input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-xs);padding:5px 8px;font-size:12px;color:var(--text);width:100%;text-align:right;transition:all .15s;font-family:inherit;font-variant-numeric:tabular-nums}
.ract input:focus{outline:none;border-color:var(--text);background:#fff}
.ract input::placeholder{color:var(--text3)}
.rdiff{font-size:11px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.over{color:var(--red)}.under{color:var(--green)}.neutral{color:var(--text3)}
.s-amt{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.t-lbl{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.worst-badge{display:inline-flex;align-items:center;font-size:9px;font-weight:600;padding:1px 5px;border-radius:100px;background:var(--red-bg);color:var(--red);margin-left:5px;vertical-align:middle}
.add-btn{background:none;border:1px dashed var(--border2);border-radius:var(--radius-xs);padding:8px;width:100%;color:var(--text3);font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.add-btn:hover{border-color:var(--text2);color:var(--text2)}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1;transition:color .15s;flex-shrink:0}
.del-btn:hover{color:var(--red)}
.txt-inp{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-xs);padding:5px 8px;font-size:12px;color:var(--text);font-family:inherit;width:100%;transition:all .15s}
.txt-inp:focus{outline:none;border-color:var(--text);background:#fff}
.txt-inp::placeholder{color:var(--text3)}
.notes-area{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;font-size:13px;color:var(--text);font-family:inherit;resize:none;min-height:80px;transition:border-color .15s;line-height:1.6;user-select:text}
.notes-area:focus{outline:none;border-color:var(--border2)}
.notes-area::placeholder{color:var(--text3)}

/* HISTORY */
.history-month{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.history-month:hover{border-color:var(--border2)}
.hm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hm-label{font-size:14px;font-weight:600}
.hm-bar-track{height:4px;background:var(--bg);border-radius:100px;overflow:hidden}
.hm-bar-fill{height:100%;border-radius:100px}
.hm-stats{display:flex;gap:16px;margin-top:8px}
.hm-stat{font-size:11px;color:var(--text3)}
.hm-stat strong{color:var(--text);font-weight:600}

/* FOOTER */
.page-footer{text-align:center;padding:24px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.page-footer span{font-size:11px;color:var(--text3)}

/* SETTINGS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.overlay.open{opacity:1;pointer-events:all}
.sp{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;border-left:1px solid var(--border);box-shadow:-20px 0 60px rgba(0,0,0,.08);z-index:101;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:1.5rem;padding-top:calc(1.5rem + var(--safe-top))}
.sp.open{transform:translateX(0)}
.sp-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.sp-hdr h2{font-size:15px;font-weight:600}
.sp-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.sp-sec{margin-bottom:1.25rem}
.sp-sec-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem;display:flex;justify-content:space-between;align-items:center}
.sp-add{background:none;border:none;color:var(--blue);font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;padding:0}
.sp-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px}
.sp-drag{color:var(--text3);font-size:12px;cursor:grab;user-select:none;padding:0 2px}
.sp-name{flex:1}
.sp-est{width:90px}
.sp-est input,.sp-name input{background:#fff;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;color:var(--text);font-family:inherit;width:100%}
.sp-est input{text-align:right}
.sp-est input:focus,.sp-name input:focus{outline:none;border-color:var(--border2)}
.sp-save{width:100%;background:var(--text);border:none;border-radius:var(--radius-sm);padding:10px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;margin-top:1rem;font-family:inherit;transition:opacity .15s}
.sp-save:hover{opacity:.85}

<script>
// ── SUPABASE ──────────────────────────────────────────────
const SURL='https://ythrdbiwkvanrjbmhujx.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0aHJkYml3a3ZhbnJqYm1odWp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODE3NzIsImV4cCI6MjA5Mjg1Nzc3Mn0.619sj9HIkvyFgT7OIH7AKTaqVYihHjR3nPeC8dLoDzs';
const supa=supabase.createClient(SURL,SKEY);
let currentUser=null;
let saveTimer=null;

function setBadge(t){const el=document.getElementById('save-badge');if(el)el.textContent=t}

async function saveState(){
  if(!currentUser)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    setBadge('Saving...');
    const{error}=await supa.from('budget_data').upsert({id:currentUser.id,user_id:currentUser.id,data:{cfg,mdata,unlocked,curIdx,savingsGoal},updated_at:new Date().toISOString()});
    setBadge(error?'Error':'Saved ✓');
    setTimeout(()=>setBadge(''),2500);
  },700);
}

async function loadState(){
  if(!currentUser)return;
  const{data}=await supa.from('budget_data').select('data').eq('id',currentUser.id).single();
  if(data?.data&&Object.keys(data.data).length){
    const d=data.data;
    if(d.cfg)cfg=d.cfg;if(d.mdata)mdata=d.mdata;
    if(d.unlocked)unlocked=d.unlocked;if(d.curIdx!==undefined)curIdx=d.curIdx;
    if(d.savingsGoal!==undefined)savingsGoal=d.savingsGoal;
  }
}

// ── AUTH ──────────────────────────────────────────────────
let authMode='login';
function setAuthTab(mode,el){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('auth-submit').textContent=mode==='login'?'Sign in':'Create account';
  document.getElementById('auth-name-field').style.display=mode==='signup'?'block':'none';
  document.getElementById('auth-error').classList.remove('show');
  if(mode==='signup')document.getElementById('auth-password').autocomplete='new-password';
  else document.getElementById('auth-password').autocomplete='current-password';
}

function showAuthError(msg){
  const el=document.getElementById('auth-error');
  el.textContent=msg;el.classList.add('show');
}

async function handleAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const btn=document.getElementById('auth-submit');
  if(!email||!password){showAuthError('Please enter your email and password');return}
  btn.disabled=true;btn.textContent=authMode==='login'?'Signing in...':'Creating account...';
  document.getElementById('auth-error').classList.remove('show');
  if(authMode==='login'){
    const{data,error}=await supa.auth.signInWithPassword({email,password});
    if(error){showAuthError(error.message);btn.disabled=false;btn.textContent='Sign in'}
  }else{
    const name=document.getElementById('auth-name').value.trim()||email.split('@')[0];
    const{data,error}=await supa.auth.signUp({email,password,options:{data:{full_name:name}}});
    if(error){showAuthError(error.message);btn.disabled=false;btn.textContent='Create account'}
    else if(data.user&&!data.session){showAuthError('Check your email for a confirmation link!');btn.disabled=false;btn.textContent='Create account'}
  }
}

async function handleGoogle(){
  const{error}=await supa.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});
  if(error)showAuthError(error.message);
}

async function handleLogout(){
  await supa.auth.signOut();
  currentUser=null;cfg=getDefaultCfg();mdata={};unlocked=[{mi:new Date().getMonth(),y:new Date().getFullYear()}];curIdx=0;savingsGoal=0;
  document.getElementById('app').classList.remove('show');
  document.getElementById('auth-screen').classList.add('show');
  closeSettings();
}

// Listen to auth state
supa.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user){
    currentUser=session.user;
    document.getElementById('auth-screen').classList.remove('show');
    await loadState();
    document.getElementById('app').classList.add('show');
    renderNav();renderTab();
    initSwipe();checkA2HS();checkNewMonth();
  }else{
    currentUser=null;
    document.getElementById('app').classList.remove('show');
  }
});

// ── STATE ─────────────────────────────────────────────────
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let unlocked=[{mi:new Date().getMonth(),y:new Date().getFullYear()}];
let curIdx=0;let savingsGoal=0;let curTab='dashboard';
let swipeStartX=0;let swipeStartY=0;
function mkey(m){return m.mi+'-'+m.y}
function mlabel(m){return MN[m.mi]+" '"+String(m.y).slice(2)}
function nextM(m){return m.mi<11?{mi:m.mi+1,y:m.y}:{mi:0,y:m.y+1}}
function getDefaultCfg(){return{takeHome:100000,rows:{fixed:[{id:'f1',name:'Rent',est:20000},{id:'f2',name:'Bills',sub:'electricity · wifi · phone',est:3000}],variable:[{id:'v1',name:'Groceries',est:6000},{id:'v2',name:'Commute',est:3000},{id:'v3',name:'Eating out',est:4000}],discr:[{id:'d1',name:'Shopping',est:3000},{id:'d2',name:'Entertainment',est:2000},{id:'d3',name:'Buffer',est:2000}]}}}
let cfg=getDefaultCfg();
let mdata={};
function getMD(k){if(!mdata[k])mdata[k]={takeHome:'',oti:[],actuals:{},debt:[],invest:[],notes:''};return mdata[k]}
function hasData(k){const d=mdata[k];if(!d)return false;return!!(d.takeHome||Object.keys(d.actuals||{}).length||(d.oti||[]).some(r=>r.amt)||(d.debt||[]).some(r=>r.amt)||(d.invest||[]).some(r=>r.amt))}
function curKey(){return mkey(unlocked[curIdx])}
function allRows(){return[...cfg.rows.fixed,...cfg.rows.variable,...cfg.rows.discr]}
function fmt(n){if(isNaN(n)||n===null)return'—';return'₹'+Math.round(n).toLocaleString('en-IN')}
function fmtD(d){if(isNaN(d)||d===null||d===0)return{t:'—',c:'neutral'};return{t:(d>0?'+':'−')+fmt(Math.abs(d)),c:d>0?'over':'under'}}
function calcMonth(m){
  const d=getMD(mkey(m));const ar=allRows();
  const bTH=d.takeHome?parseFloat(d.takeHome):cfg.takeHome;
  const oti=(d.oti||[]).reduce((s,r)=>s+(parseFloat(r.amt)||0),0);
  const totalIncome=bTH+oti;
  const debt=(d.debt||[]).reduce((s,r)=>s+(parseFloat(r.amt)||0),0);
  const invest=(d.invest||[]).reduce((s,r)=>s+(parseFloat(r.amt)||0),0);
  const anyAct=Object.keys(d.actuals||{}).length>0;
  let actSpend=0;ar.forEach(r=>{actSpend+=d.actuals[r.id]!==undefined?parseFloat(d.actuals[r.id]):r.est});
  const estSpend=ar.reduce((s,r)=>s+r.est,0);
  const spendUsed=anyAct?actSpend:estSpend;
  const surplus=totalIncome-spendUsed-debt-invest;
  const rate=Math.round((surplus/totalIncome)*100);
  return{totalIncome,actSpend,estSpend,debt,invest,surplus,rate,anyAct,spendUsed};
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg,type='',icon=''){
  const wrap=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.innerHTML=(icon?`<span>${icon}</span>`:'')+`<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{t.style.animation='toastOut .3s ease forwards';setTimeout(()=>t.remove(),300)},3500);
}

// ── CONFETTI ──────────────────────────────────────────────
function fireConfetti(){
  const colors=['#16a34a','#2563eb','#7c3aed','#d97706','#dc2626','#1a1a18'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.2+Math.random()*1.5}s;animation-delay:${Math.random()*.4}s;border-radius:${Math.random()>.5?'50%':'2px'};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
  }
}

// ── A2HS ──────────────────────────────────────────────────
function checkA2HS(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone;
  const dismissed=localStorage.getItem('a2hs_dismissed');
  if(isIOS&&!isStandalone&&!dismissed)setTimeout(()=>document.getElementById('a2hs').classList.add('show'),2500);
}
function dismissA2HS(){document.getElementById('a2hs').classList.remove('show');localStorage.setItem('a2hs_dismissed','1')}

// ── SWIPE ─────────────────────────────────────────────────
function initSwipe(){
  const sa=document.getElementById('scroll-area');
  sa.addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY},{passive:true});
  sa.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-swipeStartX;
    const dy=e.changedTouches[0].clientY-swipeStartY;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&curIdx<unlocked.length-1)switchM(curIdx+1,'left');
      else if(dx>0&&curIdx>0)switchM(curIdx-1,'right');
    }
  },{passive:true});
}

// ── NAV ───────────────────────────────────────────────────
function renderNav(){
  const el=document.getElementById('month-nav');
  el.innerHTML=unlocked.map((m,i)=>{
    const k=mkey(m);let c='m-btn';
    if(i===curIdx)c+=' active';if(hasData(k))c+=' has-data';
    return`<button class="${c}" onclick="switchM(${i})">${mlabel(m)}</button>`;
  }).join('')+`<button class="m-btn m-add" onclick="addMonth()">+</button>`;
  setTimeout(()=>{const a=el.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})},50);
}
let prevGoalMet=false;
function switchM(i,dir='left'){curIdx=i;renderNav();document.getElementById('page-content').className=dir==='left'?'page':'page-left';renderTab();saveState()}
function addMonth(){unlocked.push(nextM(unlocked[unlocked.length-1]));curIdx=unlocked.length-1;renderNav();renderTab();saveState()}

function switchTab(tab,el){
  curTab=tab;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-content').className='page';
  renderTab();
}
function renderTab(){
  document.getElementById('hdr-sub').textContent=mlabel(unlocked[curIdx]);
  if(curTab==='dashboard')renderDashboard();
  else if(curTab==='track')renderTrack();
  else if(curTab==='invest')renderInvest();
  else if(curTab==='history')renderHistory();
}

// ── DASHBOARD ─────────────────────────────────────────────
let ringChart,barChart,trendChart;
function renderDashboard(){
  const{totalIncome,actSpend,estSpend,debt,invest,surplus,rate,anyAct,spendUsed}=calcMonth(unlocked[curIdx]);
  const md=getMD(curKey());const ar=allRows();
  const clampRate=Math.max(0,Math.min(100,rate||0));
  const ringColor=rate>=20?'#16a34a':rate>=10?'#d97706':'#dc2626';
  let deltaHTML='';
  if(curIdx>0&&anyAct){const prev=calcMonth(unlocked[curIdx-1]);if(prev.anyAct){const d=actSpend-prev.actSpend;deltaHTML=`<span class="kpi-delta ${d>0?'delta-up':'delta-down'}">${d>0?'↑':'↓'} ${fmt(Math.abs(d))} vs last month</span>`}}
  const goalPct=savingsGoal>0?Math.min(100,Math.round((surplus/savingsGoal)*100)):0;
  const goalColor=goalPct>=100?'#16a34a':goalPct>=60?'#d97706':'#dc2626';
  if(savingsGoal>0&&goalPct>=100&&!prevGoalMet){prevGoalMet=true;fireConfetti();showToast('Goal smashed! You hit your savings target 🎯','celebrate','🎉')}
  else if(goalPct<100)prevGoalMet=false;
  const surpluses=unlocked.map(m=>{const c=calcMonth(m);return c.anyAct?c.surplus:null}).filter(v=>v!==null);
  const avg=surpluses.length?surpluses.reduce((a,b)=>a+b,0)/surpluses.length:surplus;
  let worstRow=null;let worstAmt=-Infinity;
  ar.forEach(r=>{if(md.actuals[r.id]!==undefined){const o=parseFloat(md.actuals[r.id])-r.est;if(o>worstAmt){worstAmt=o;worstRow=r}}});
  let iCls='insight-green',iTitle='',iBody='';
  if(!anyAct){iCls='insight-green';iTitle='Start tracking';iBody='Enter your actual spend in the Track tab to see insights.'}
  else if(rate>=20){iCls='insight-green';iTitle=`On track — ${rate}% savings rate`;iBody=worstRow&&worstAmt>0?`Biggest overspend: ${worstRow.name} by ${fmt(worstAmt)}`:'Great job keeping spend under control.'}
  else if(rate>=10){iCls='insight-amber';iTitle=`Watch your spend — ${rate}% savings rate`;iBody=worstRow&&worstAmt>0?`Biggest overspend: ${worstRow.name} by ${fmt(worstAmt)}`:'Try to target 20% savings rate.'}

// ── TRACK ─────────────────────────────────────────────────
function renderTrack(){
  const md=getMD(curKey());const ar=allRows();
  let worstId=null;let worstOver=-Infinity;
  ar.forEach(r=>{if(md.actuals[r.id]!==undefined){const o=parseFloat(md.actuals[r.id])-r.est;if(o>worstOver){worstOver=o;worstId=r.id}}});
  let h='';
  h+=`<div class="sec-hdr"><div class="sec-hdr-left"><span class="sec-title">Income</span><span class="sec-tag tag-green">take-home</span></div>${curIdx>0?`<button class="copy-btn" onclick="copyLastMonth()">↩ Copy last month</button>`:''}</div>`;
  h+=`<div class="tbl"><div class="tbl-head c4"><span class="th">Source</span><span class="th">Budget</span><span class="th">Actual</span><span class="th">Diff</span></div><div class="tbl-row c4"><div><div class="rname">Monthly salary</div><div class="rsub">after tax</div></div><div class="rest">${fmt(cfg.takeHome)}</div><div class="ract"><input type="number" id="inp-th" placeholder="—" value="${md.takeHome||''}" oninput="onChg()"></div><div class="rdiff neutral" id="d-th">—</div></div></div>`;
  h+=`<div class="sec-hdr"><div class="sec-hdr-left"><span class="sec-title">One-time income</span><span class="sec-tag tag-blue">bonus · freelance</span></div></div>`;
  h+=`<div class="tbl"><div class="tbl-head c3"><span class="th">Source</span><span class="th">Amount</span><span class="th"></span></div>`;
  (md.oti||[]).forEach((row,i)=>{h+=`<div class="tbl-row c3"><input class="txt-inp" placeholder="e.g. bonus" value="${row.label||''}" oninput="updOTI(${i},'label',this.value)"><div class="ract"><input type="number" placeholder="—" value="${row.amt||''}" oninput="updOTI(${i},'amt',this.value)"></div><button class="del-btn" onclick="rmOTI(${i})">✕</button></div>`});
  h+=`<div class="tbl-row" style="grid-template-columns:1fr;padding:8px 12px"><button class="add-btn" onclick="addOTI()">+ add one-time income</button></div></div>`;
  const secs=[{k:'fixed',label:'Fixed costs',tag:'tag-purple',sub:'locked in'},{k:'variable',label:'Variable costs',tag:'tag-amber',sub:'daily living'},{k:'discr',label:'Discretionary',tag:'tag-gray',sub:'lifestyle'}];
  secs.forEach(sec=>{
    const rows=cfg.rows[sec.k];const secEst=rows.reduce((s,r)=>s+r.est,0);
    h+=`<div class="sec-hdr"><div class="sec-hdr-left"><span class="sec-title">${sec.label}</span><span class="sec-tag ${sec.tag}">${sec.sub}</span></div></div>`;
    h+=`<div class="tbl"><div class="tbl-head c4"><span class="th">Item</span><span class="th">Budget</span><span class="th">Actual</span><span class="th">Diff</span></div>`;
    rows.forEach(row=>{
      const act=md.actuals[row.id]!==undefined?md.actuals[row.id]:'';
      const isWorst=worstId===row.id&&worstOver>0;
      h+=`<div class="tbl-row c4"><div><div class="rname">${row.name}${isWorst?'<span class="worst-badge">↑ most over</span>':''}</div>${row.sub?`<div class="rsub">${row.sub}</div>`:''}</div><div class="rest">${fmt(row.est)}</div><div class="ract"><input type="number" data-rid="${row.id}" placeholder="—" value="${act}" oninput="onChg()"></div><div class="rdiff neutral" id="d-${row.id}">—</div></div>`;
    });
    const hasAny=rows.some(r=>md.actuals[r.id]!==undefined&&md.actuals[r.id]!=='');
    const secAct=rows.reduce((s,r)=>s+(md.actuals[r.id]!==undefined?parseFloat(md.actuals[r.id]):r.est),0);
    h+=`<div class="tbl-row tbl-total c4"><div class="t-lbl">${sec.label} total</div><div class="rest" style="font-weight:600;color:var(--text)">${fmt(secEst)}</div><div class="s-amt" id="sa-${sec.k}">${hasAny?fmt(secAct):'—'}</div><div class="rdiff neutral" id="sd-${sec.k}">—</div></div></div>`;
  });
  h+=`<div class="sec-hdr"><div class="sec-hdr-left"><span class="sec-title">Debt & dues</span><span class="sec-tag tag-red">reduces surplus</span></div></div>`;
  h+=`<div class="tbl"><div class="tbl-head c3"><span class="th">Description</span><span class="th">Amount</span><span class="th"></span></div>`;
  (md.debt||[]).forEach((row,i)=>{h+=`<div class="tbl-row c3"><input class="txt-inp" placeholder="e.g. HDFC CC bill" value="${row.label||''}" oninput="updDebt(${i},'label',this.value)"><div class="ract"><input type="number" placeholder="—" value="${row.amt||''}" oninput="updDebt(${i},'amt',this.value)"></div><button class="del-btn" onclick="rmDebt(${i})">✕</button></div>`});
  h+=`<div class="tbl-row" style="grid-template-columns:1fr;padding:8px 12px"><button class="add-btn" onclick="addDebt()">+ add debt / due</button></div></div>`;
  h+=`<div class="sec-hdr"><div class="sec-hdr-left"><span class="sec-title">Notes</span><span class="sec-tag tag-gray">this month</span></div></div>`;
  h+=`<textarea class="notes-area" placeholder="Any context for this month…" oninput="onNotesChg()">${md.notes||''}</textarea>`;
  document.getElementById('page-content').innerHTML=h;
  recalcTrack();
}

function recalcTrack(){
  const md=getMD(curKey());const ar=allRows();
  ar.forEach(row=>{
    const el=document.getElementById('d-'+row.id);if(!el)return;
    if(md.actuals[row.id]!==undefined){const d=fmtD(parseFloat(md.actuals[row.id])-row.est);el.textContent=d.t;el.className='rdiff '+d.c}
    else{el.textContent='—';el.className='rdiff neutral'}
  });
  const thD=document.getElementById('d-th');
  if(thD){if(md.takeHome){const d=fmtD(parseFloat(md.takeHome)-cfg.takeHome);thD.textContent=d.t;thD.className='rdiff '+d.c}else{thD.textContent='—';thD.className='rdiff neutral'}}
  ['fixed','variable','discr'].forEach(k=>{
    const rows=cfg.rows[k];
    const hasAny=rows.some(r=>md.actuals[r.id]!==undefined&&md.actuals[r.id]!=='');
    const secAct=rows.reduce((s,r)=>s+(md.actuals[r.id]!==undefined?parseFloat(md.actuals[r.id]):r.est),0);
    const secEst=rows.reduce((s,r)=>s+r.est,0);
    const sa=document.getElementById('sa-'+k);const sd=document.getElementById('sd-'+k);
    if(sa)sa.textContent=hasAny?fmt(secAct):'—';
    if(sd){if(hasAny){const d=fmtD(secAct-secEst);sd.textContent=d.t;sd.className='rdiff '+d.c}else{sd.textContent='—';sd.className='rdiff neutral'}}
  });
}

    <div class="kpi"><div class="kpi-label">This month</div><div class="kpi-val" style="color:#16a34a">${investTotal>0?fmt(investTotal):'—'}</div><div class="kpi-sub">invested</div></div>
    <div class="kpi"><div class="kpi-label">All time</div><div class="kpi-val">${allTotal>0?fmt(allTotal):'—'}</div><div class="kpi-sub">total invested</div></div>
  </div>`;
  h+=`<div class="sec-hdr"><div class="sec-hdr-left"><span class="sec-title">Investments</span><span class="sec-tag tag-green">SIP · MF · stocks</span></div></div>`;

// ── HISTORY ───────────────────────────────────────────────
function renderHistory(){
  const months=[...unlocked].reverse();
  let h='';
  if(!months.some(m=>hasData(mkey(m)))){h=`<div style="text-align:center;padding:3rem 1rem;color:var(--text3)"><div style="font-size:32px;margin-bottom:12px">📅</div><div style="font-size:14px;font-weight:500;color:var(--text2);margin-bottom:4px">No history yet</div><div style="font-size:13px">Start tracking a month to see it here</div></div>`}
  else months.forEach(m=>{
    const k=mkey(m);if(!hasData(k))return;
    const c=calcMonth(m);const pct=Math.min(100,Math.round((c.spendUsed/c.totalIncome)*100));
    const bc=c.rate>=20?'#16a34a':c.rate>=10?'#d97706':'#dc2626';
    h+=`<div class="history-month" onclick="jumpToMonth('${k}')"><div class="hm-top"><span class="hm-label">${mlabel(m)}</span><span style="font-size:14px;font-weight:600;color:${c.surplus>0?'#16a34a':'#dc2626'}">${fmt(c.surplus)}</span></div><div class="hm-bar-track"><div class="hm-bar-fill" style="width:${pct}%;background:${bc}"></div></div><div class="hm-stats"><div class="hm-stat">Income: <strong>${fmt(c.totalIncome)}</strong></div><div class="hm-stat">Spend: <strong>${fmt(c.spendUsed)}</strong></div><div class="hm-stat">Rate: <strong style="color:${bc}">${c.rate}%</strong></div></div></div>`;
  });
  document.getElementById('page-content').innerHTML=h;
}
function jumpToMonth(k){const idx=unlocked.findIndex(m=>mkey(m)===k);if(idx>=0){curIdx=idx;renderNav();switchTab('dashboard',document.querySelector('.nav-item'))}}

// ── HANDLERS ──────────────────────────────────────────────
function onChg(){
  const md=getMD(curKey());
  const ti=document.getElementById('inp-th');if(ti)md.takeHome=ti.value;
  document.querySelectorAll('.ract input[data-rid]').forEach(inp=>{
    if(inp.value!=='')md.actuals[inp.dataset.rid]=parseFloat(inp.value);else delete md.actuals[inp.dataset.rid];
  });
  renderNav();recalcTrack();saveState();
}
function onNotesChg(){const md=getMD(curKey());const el=document.querySelector('.notes-area');if(el)md.notes=el.value;saveState()}
function updOTI(i,f,v){const md=getMD(curKey());if(!md.oti[i])md.oti[i]={};md.oti[i][f]=f==='amt'?parseFloat(v)||'':v;recalcTrack();saveState()}
function addOTI(){getMD(curKey()).oti.push({label:'',amt:''});renderTrack()}
function rmOTI(i){getMD(curKey()).oti.splice(i,1);renderTrack();saveState()}
function updDebt(i,f,v){const md=getMD(curKey());if(!md.debt[i])md.debt[i]={};md.debt[i][f]=f==='amt'?parseFloat(v)||'':v;recalcTrack();saveState()}
function addDebt(){getMD(curKey()).debt.push({label:'',amt:''});renderTrack()}
function rmDebt(i){getMD(curKey()).debt.splice(i,1);renderTrack();saveState()}
function updInvest(i,f,v){const md=getMD(curKey());if(!md.invest[i])md.invest[i]={};md.invest[i][f]=f==='amt'?parseFloat(v)||'':v;saveState()}
function addInvest(){getMD(curKey()).invest.push({label:'',amt:''});renderInvest()}
function rmInvest(i){getMD(curKey()).invest.splice(i,1);renderInvest();saveState()}
function copyLastMonth(){
  if(curIdx===0)return;
  const p=getMD(mkey(unlocked[curIdx-1]));const c=getMD(curKey());
  c.actuals={...p.actuals};c.takeHome=p.takeHome;
  c.debt=JSON.parse(JSON.stringify(p.debt||[]));c.invest=JSON.parse(JSON.stringify(p.invest||[]));
  renderTrack();saveState();showToast('Copied from last month','success','✓');
}
function exportCSV(){
  const m=unlocked[curIdx];const md=getMD(mkey(m));const ar=allRows();
  let rows=[['Category','Item','Budgeted','Actual','Diff']];
  ar.forEach(r=>{const act=md.actuals[r.id]!==undefined?md.actuals[r.id]:'';rows.push(['Expense',r.name,r.est,act,act!==''?act-r.est:''])});
  (md.oti||[]).forEach(r=>rows.push(['One-time income',r.label||'',0,r.amt||'','']));
  (md.debt||[]).forEach(r=>rows.push(['Debt',r.label||'',0,r.amt||'','']));
  (md.invest||[]).forEach(r=>rows.push(['Investment',r.label||'',0,r.amt||'','']));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.map(r=>r.join(',')).join('\n'));
  a.download='budget-'+mlabel(m).replace(' ','-')+'.csv';a.click();
  showToast('CSV exported','success','↓');
}

function openSettings(){

  const u=currentUser;
  const name=u?.user_metadata?.full_name||u?.email?.split('@')[0]||'User';
  const email=u?.email||'';
  const initials=name.slice(0,2).toUpperCase();
  document.getElementById('sp-user-wrap').innerHTML=`<div class="sp-sec"><div class="sp-sec-title">Account</div><div class="sp-user-card"><div class="sp-avatar">${initials}</div><div class="sp-user-info"><div class="sp-user-name">${name}</div><div class="sp-user-email">${email}</div></div><button class="sp-logout" onclick="handleLogout()">Sign out</button></div></div>`;
  document.getElementById('overlay').classList.add('open');document.getElementById('sp').classList.add('open');
}
function closeSettings(){document.getElementById('overlay').classList.remove('open');document.getElementById('sp').classList.remove('open')}
function spRender(){
  ['fixed','variable','discr'].forEach(k=>{
    document.getElementById('sp-'+k).innerHTML=cfg.rows[k].map((row,i)=>`
      <div class="sp-row" draggable="true" data-k="${k}" data-i="${i}" ondragstart="dS(event)" ondragover="dO(event)" ondrop="dD(event)" ondragend="dE(event)">
        <span class="sp-drag">⠿</span>
        <div class="sp-name"><input type="text" value="${row.name}" placeholder="Name" oninput="spUpd('${k}',${i},'name',this.value)"></div>
        <div class="sp-est"><input type="number" value="${row.est}" placeholder="Est." oninput="spUpd('${k}',${i},'est',this.value)"></div>
        <button class="del-btn" onclick="spDel('${k}',${i})">✕</button>
      </div>`).join('');
  });
}
function spUpd(k,i,f,v){if(f==='est')cfg.rows[k][i].est=parseFloat(v)||0;else cfg.rows[k][i][f]=v}
function spDel(k,i){cfg.rows[k].splice(i,1);spRender()}
function spAdd(k){cfg.rows[k].push({id:k[0]+Date.now(),name:'',est:0});spRender()}
function saveSP(){cfg.takeHome=parseFloat(document.getElementById('sp-th').value)||100000;closeSettings();renderTab();saveState()}
let dSrc=null;
function dS(e){dSrc=e.currentTarget;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function dO(e){e.preventDefault()}
function dE(e){e.currentTarget.classList.remove('dragging')}
function dD(e){
  e.preventDefault();const t=e.currentTarget;
  if(!dSrc||dSrc===t||dSrc.dataset.k!==t.dataset.k)return;
  const k=dSrc.dataset.k;const[moved]=cfg.rows[k].splice(parseInt(dSrc.dataset.i),1);cfg.rows[k].splice(parseInt(t.dataset.i),0,moved);spRender();
}

function checkNewMonth(){
  const now=new Date();const mi=now.getMonth();const y=now.getFullYear();
  if(!unlocked.find(m=>m.mi===mi&&m.y===y))showToast(`Welcome to ${MN[mi]}! Ready to track?`,'','📅');
}

// ── INIT ──────────────────────────────────────────────────
// Check session on load and show correct screen
supa.auth.getSession().then(({data:{session}})=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>document.getElementById('splash').style.display='none',400);
    if(!session){
      document.getElementById('auth-screen').classList.add('show');
    }
  },1200);
});
</script>
